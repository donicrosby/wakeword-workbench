# Basic Wake Word Dataset Configuration
# This is a minimal example for generating a simple wake word dataset

wake_word: "hey vera"

samples:
  positives: 100
  negatives_multiplier: 5  # Generate 500 negative samples

negatives:
  custom_phrases: ["archer"]
  confusion:
    enabled: true
    weight: 0.6
    min_similarity: 0.6
  synthetic:
    enabled: true
    weight: 0.4
    strategy: random
    min_word_count: 2
    max_word_count: 4

tts:
  providers:
    - backend: "kokoro"
      voices:
        - "af_sarah"
        - "am_adam"
      speed: 1.0

augmentation:
  noise_snr: [-10, 10]
  reverb_probability: 0.5
  gain_range: [-45, 0]

output:
  path: "./output/basic_dataset"
  format: ["microwakeword"]
