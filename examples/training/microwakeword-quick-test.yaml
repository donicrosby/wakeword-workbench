# microWakeWord Quick Test Configuration
# =========================================
# Purpose: Rapid workflow testing with small dataset
# Expected runtime: 5-15 minutes
# Use for: Validating training pipeline, testing new augmentation strategies
#
# Prerequisites:
# - Run wakeword-workbench to generate feature data in RaggedMmap format
# - Download negative datasets from Hugging Face
# - Ensure features_dir paths point to valid *_mmap/ directories

# Training directory containing split subdirectories (training/, validation/, testing/)
# Update this to point to your generated features
train_dir: "./output/quick_test/training_data"

# Duration of audio clips in milliseconds (must match feature extraction)
clip_duration_ms: 1000

# Window step for spectrogram generation (ms)
window_step_ms: 10

# Evaluation interval (steps between validation checks)
eval_step_interval: 500

# =========================================
# FEATURE SETS
# =========================================
# Each feature set defines a data source with class balance controls.
# microWakeWord randomly selects from feature sets based on sampling_weight.
#
# REQUIRED: Replace paths with your actual feature directories
# Format: features_dir must contain training/, validation/, testing/ subdirs
#         Each subdir contains *_mmap/ directories (RaggedMmap format)

features:
  # Positive wake word samples
  # Set truth=True for wake word clips
  - features_dir: "./output/quick_test/training_data/wakeword_mmap"
    truth: true
    sampling_weight: 2.0    # Higher weight = more frequent selection
    penalty_weight: 1.0      # Loss multiplier
    truncation_strategy: "truncate_start"  # Strategy for clips longer than clip_duration_ms
    type: "mmap"

  # Generic negative samples (speech, music, environmental sounds)
  - features_dir: "./output/quick_test/training_data/negatives_mmap"
    truth: false
    sampling_weight: 10.0    # More negatives than positives
    penalty_weight: 1.0
    truncation_strategy: "truncate_start"
    type: "mmap"

  # Optional: Ambient/background samples for validation
  # Uncomment if you have ambient validation data
  # - features_dir: "./data/validation_ambient_mmap"
  #   truth: false
  #   sampling_weight: 2.0
  #   penalty_weight: 0.5  # Lower weight for ambient samples
  #   truncation_strategy: "truncate_start"
  #   type: "mmap"

# =========================================
# TRAINING SCHEDULE
# =========================================
# Lists are auto-padded to match len(training_steps)

# Total training steps
training_steps: [3000]  # ~5-10 min with quick-test dataset

# Learning rates (schedule by repeating values)
learning_rates: [0.001]

# Batch size (larger = faster but more memory)
batch_size: 64

# =========================================
# CLASS WEIGHTS
# =========================================
# Control loss contribution per class.
# Higher negative weight = model more aggressively avoids false positives.

positive_class_weight: [1.0]
negative_class_weight: [10.0]  # Higher for more false-positive rejection

# =========================================
# AUGMENTATION
# =========================================
# In-model augmentation (applied during training)

# MixUp augmentation probability
mix_up_augmentation_prob: [0.0]

# Frequency domain mixing probability
freq_mix_augmentation_prob: [0.0]

# Time masking parameters
time_mask_max_size: [5]    # Max frames to mask
time_mask_count: [2]       # Number of time masks

# Frequency masking parameters
freq_mask_max_size: [5]    # Max frequency bins to mask
freq_mask_count: [2]       # Number of frequency masks

# =========================================
# MODEL SELECTION METRICS
# =========================================
# Two-stage selection: minimize primary, then maximize secondary

# Primary metric: stop training when below this value
target_minimization: 0.05  # Target validation loss

# Secondary metric: maximize this once target is met
# Options: val_accuracy, val_recall, val_specificity
maximization_metric: "val_recall"

# =========================================
# MIXEDNET ARCHITECTURE
# =========================================
# Lightweight model for fast iteration

# Pointwise convolution filters per block
pointwise_filters: "32,32,32,32"  # Smaller than default for quick testing

# Stride for downsampling
stride: 3

# Residual connections (0=disabled, 1=enabled per block)
residual_connection: "0,0,0,0,0"

# MixConv kernel sizes (comma-separated, space-separated list in list)
mixconv_kernel_sizes: "[5], [9], [13], [21]"

# First convolution parameters
first_conv_filters: 32
first_conv_kernel_size: 3
max_pool: 0
spatial_attention: 0
pooled: 0
