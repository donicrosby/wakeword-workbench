[project]
name = "wakeword-workbench"
version = "0.1.0"
description = "Wake word training workbench for micro wake word detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Wake Word Team" }
]
keywords = ["wake-word", "microphone", "audio", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<1.15",
    "librosa>=0.10,<0.11",
    "soundfile>=0.12",
    "audiomentations>=0.35,<1.0",
    "structlog>=24.1",
    "jellyfish>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    {include-group = "tts"},
    "tensorflow>=2.15",
    "pymicro-features>=0.5",
    "mmap-ninja>=0.6",
    "datasets>=2.16",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "types-pyyaml>=6.0.12.20260408",
    "scipy-stubs>=1.17.1.3",
    "pre-commit>=4.5.1",
]
tts-kokoro = [
    "pykokoro>=0.6",
    "spacy>=3.8",
    "en-core-web-sm",
]
tts-piper = [
    "piper-tts>=1.2"
]
tts = [
    {include-group = "tts-kokoro"},
    {include-group = "tts-piper"}
]

[project.optional-dependencies]
kokoro = [
    "pykokoro>=0.6",
    "spacy>=3.8",
    "en-core-web-sm",
]
piper = ["piper-tts>=1.2"]
kokoro-cuda = [
    "pykokoro[gpu]>=0.6",
    "spacy>=3.8",
    "en-core-web-sm",
]
kokoro-openvino = [
    "pykokoro[openvino]>=0.6",
    "spacy>=3.8",
    "en-core-web-sm",
]
piper-cuda = [
    "piper-tts>=1.2",
    "onnxruntime-gpu>=1.22",
]

[tool.uv]
conflicts = [
    [{ extra = "kokoro" }, { extra = "kokoro-cuda" }],
    [{ extra = "kokoro" }, { extra = "kokoro-openvino" }],
    [{ extra = "kokoro-cuda" }, { extra = "kokoro-openvino" }],
    [{ extra = "piper" }, { extra = "piper-cuda" }],
    [{ extra = "kokoro-openvino" }, { extra = "piper-cuda" }],
]

[project.scripts]
wakeword-workbench = "wakeword_workbench.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "T10", "ISC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=wakeword_workbench --cov-report=term-missing"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
