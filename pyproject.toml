[project]
name = "wakeword-workbench"
version = "0.1.0"
description = "Wake word training workbench for micro wake word detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Wake Word Team" }
]
keywords = ["wake-word", "microphone", "audio", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<1.15",
    "librosa>=0.10,<0.11",
    "soundfile>=0.12",
    "audiomentations>=0.35,<1.0",
    "structlog>=24.1",
    "jellyfish>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    {include-group = "tts"},
]
tts-kokoro = [
    "pykokoro>=0.6"
]
tts-piper = [
    "piper-tts>=1.2"
]
tts = [
    {include-group = "tts-kokoro"},
    {include-group = "tts-piper"}
]

[project.optional-dependencies]
kokoro = ["pykokoro>=0.6"]
piper = ["piper-tts>=1.2"]

[project.scripts]
wakeword-workbench = "wakeword_workbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "T10", "ISC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=wakeword_workbench --cov-report=term-missing"
